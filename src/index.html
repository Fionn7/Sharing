<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <script>

    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .glass {
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
            .glass-light {
                background: rgba(255, 255, 255, 0.25);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                border: 1px solid rgba(255, 255, 255, 0.3);
            }
            .gradient-text {
                background: linear-gradient(90deg, #f8fafc, #cbd5e1);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;

            background: #000 !important;
        }

            padding: 0 !important;
            background: #000 !important;
        }
        .preview-fullscreen #previewModalContent > div,
        .preview-fullscreen #previewModalContent iframe {
            min-height: 100vh !important;

        }
        .preview-fullscreen #previewModalContent img {

            transform: translateY(100%);
        }
        .preview-fullscreen.controls-hidden #previewModalBox {

        }
    </style>
</head>
<body class="font-inter text-white overflow-x-hidden">

    <script>
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('py-2');
                navbar.classList.remove('py-4');
            } else {
                navbar.classList.add('py-4');
                navbar.classList.remove('py-2');
            }
        });

        // ESC 键关闭模态框
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePreviewModal();
                closeShareModal();
            }
        });

        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const uploadList = document.getElementById('upload-list');
        const fileList = document.getElementById('fileList');
        
        // 全局变量
        let currentCategory = 'all';
        let allFilesData = [];
        let searchQuery = '';
        let selectedFiles = new Set();
        let currentDisplayedFiles = []; // 跟踪当前页显示的文件
        let recentlyUploadedFiles = []; // 跟踪最近上传的文件名
        let diagnosticLogs = []; // 诊断日志

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-primary');
            uploadArea.classList.add('bg-primary/10');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-primary');
            uploadArea.classList.remove('bg-primary/10');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-primary');
            uploadArea.classList.remove('bg-primary/10');
            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                handleFiles(fileInput.files);
            }
        });

        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatFileSize(bytes) {
            if (bytes === 0 || !bytes) return '--';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 估算上传时间
        function estimateUploadTime(fileSizeBytes) {
            const avgUploadSpeedKBps = 500; // 假设平均上传速度 500 KB/s
            const estimatedSeconds = Math.ceil(fileSizeBytes / (avgUploadSpeedKBps * 1024));
            
            if (estimatedSeconds < 60) {
                return `预计需要 ${estimatedSeconds} 秒`;
            } else {
                const minutes = Math.floor(estimatedSeconds / 60);
                const seconds = estimatedSeconds % 60;
                if (seconds === 0) {
                    return `预计需要 ${minutes} 分钟`;
                } else {
                    return `预计需要 ${minutes} 分钟 ${seconds} 秒`;
                }
            }
        }

        function getFileIconClass(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['pdf'].includes(ext)) return 'text-red-400';
            if (['doc', 'docx'].includes(ext)) return 'text-blue-400';
            if (['xls', 'xlsx'].includes(ext)) return 'text-green-400';
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'].includes(ext)) return 'text-purple-400';
            if (['mp4', 'avi', 'mov', 'wmv'].includes(ext)) return 'text-yellow-400';
            if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return 'text-orange-400';
            if (['mp3', 'wav', 'flac'].includes(ext)) return 'text-pink-400';
            return 'text-gray-400';
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['pdf'].includes(ext)) return 'fa-file-pdf-o';
            if (['doc', 'docx'].includes(ext)) return 'fa-file-word-o';
            if (['xls', 'xlsx'].includes(ext)) return 'fa-file-excel-o';
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'].includes(ext)) return 'fa-file-image-o';
            if (['mp4', 'avi', 'mov', 'wmv'].includes(ext)) return 'fa-file-video-o';
            if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return 'fa-file-archive-o';
            if (['mp3', 'wav', 'flac'].includes(ext)) return 'fa-file-audio-o';
            return 'fa-file-o';
        }

        // 判断文件是否支持在线预览
        function isPreviewable(filename) {
            if (!filename || typeof filename !== 'string') return false;
            const ext = filename.split('.').pop()?.toLowerCase();
            if (!ext) return false;
            return ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg', 'webp', 'pdf', 'mp4', 'webm', 'ogg', 'mp3', 'wav', 'ppt', 'pptx', 'doc', 'docx', 'xls', 'xlsx'].includes(ext);
        }

        let currentShareDuration = 24;

        // 生成分享链接
        async function generateShareLink() {
            if (!currentShareFile.path) return;

            const btn = document.getElementById('generateShareBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>生成中...';

            try {
                const response = await fetch('/api/share', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        path: currentShareFile.path,
                        expiresInHours: currentShareDuration
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    document.getElementById('shareUrlInput').value = data.shareUrl;
                    document.getElementById('shareUrlContainer').classList.remove('hidden');
                    
                    const expireDate = new Date(data.expiresAt);
                    const expireStr = expireDate.toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    document.getElementById('shareExpireInfo').textContent = `链接有效期至: ${expireStr}`;
                    
                    btn.innerHTML = '<i class="fa fa-check mr-2"></i>已生成';
                    showToast('分享链接已生成', 'success');
                } else {
                    showToast(data.message || '生成分享链接失败', 'error');
                    btn.innerHTML = '<i class="fa fa-link mr-2"></i>生成分享链接';
                    btn.disabled = false;
                }
            } catch (error) {
                showToast('生成分享链接失败，请稍后重试', 'error');
                btn.innerHTML = '<i class="fa fa-link mr-2"></i>生成分享链接';
                btn.disabled = false;
            }
        }

        // 复制分享链接
        async function copyShareUrl() {
            const input = document.getElementById('shareUrlInput');
            try {
                await navigator.clipboard.writeText(input.value);
                showToast('链接已复制到剪贴板', 'success');
            } catch {
                input.select();
                document.execCommand('copy');
                showToast('链接已复制到剪贴板', 'success');
            }
        }

        // Office 文档纯前端预览（docx-preview + SheetJS + pptx-preview）
        // 不依赖外部服务，避免 Office Online 的 fetch 超时问题
        async function renderOfficePreview(ext, url, container) {
            container.innerHTML = `
                <div class="flex items-center justify-center h-full min-h-[400px]">
                    <div class="text-center">
                        <div class="w-12 h-12 mx-auto mb-4 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
                        <p class="text-white/60">正在解析文档...</p>
                    </div>
                </div>
            `;
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const ab = await resp.arrayBuffer();

                if (['doc', 'docx'].includes(ext)) {
                    container.innerHTML = '<div class="bg-white rounded-xl shadow-lg p-8 md:p-12 overflow-auto h-full min-h-[500px] text-black text-base leading-relaxed"></div>';
                    await docx.renderAsync(ab, container.firstElementChild);
                } else if (['xls', 'xlsx'].includes(ext)) {
                    const wb = XLSX.read(ab, { type: 'array' });
                    let html = '<div class="bg-white rounded-xl shadow-lg p-6 md:p-8 overflow-auto h-full min-h-[500px] text-black text-sm"></div>';
                    container.innerHTML = html;
                    const c = container.firstElementChild;
                    wb.SheetNames.forEach((sheetName) => {
                        const h3 = document.createElement('h3');
                        h3.className = 'font-bold text-lg mt-6 mb-3 first:mt-0 text-slate-800';
                        h3.textContent = sheetName;
                        c.appendChild(h3);
                        const tableHtml = XLSX.utils.sheet_to_html(wb.Sheets[sheetName]);
                        const wrapper = document.createElement('div');
                        wrapper.className = 'overflow-auto mb-4';
                        wrapper.innerHTML = tableHtml;
                        const table = wrapper.querySelector('table');
                        if (table) {
                            table.className = 'border-collapse text-sm';
                            table.style.fontSize = '14px';
                        }
                        c.appendChild(wrapper);
                    });
                } else if (['ppt', 'pptx'].includes(ext)) {
                    container.innerHTML = '<div class="bg-white rounded-xl shadow-lg p-4 overflow-auto h-full min-h-[500px] flex items-center justify-center"></div>';
                    const viewer = await import('https://esm.sh/pptx-preview@1.0.7?region=cn');
                    const c = container.firstElementChild;
                    const maxW = c.clientWidth - 32;
                    const maxH = c.clientHeight - 32;
                    const w = Math.min(1280, maxW);
                    const h = Math.round(w * 9 / 16);
                    const v = viewer.init(c, { width: w, height: h });
                    await v.preview(ab);
                }
            } catch (e) {
                container.innerHTML = `
                    <div class="flex items-center justify-center h-full min-h-[400px]">
                        <div class="text-center text-white/60">
                            <i class="fa fa-exclamation-triangle text-5xl mb-4"></i>
                            <p class="text-base">文档解析失败</p>
                            <p class="text-sm mt-2">${escapeHTML(e.message || '未知错误')}</p>
                            <p class="text-xs mt-2 text-white/40">请下载后查看</p>
                        </div>
                    </div>
                `;
            }
        }

        // 切换全屏预览
        let isFullscreen = false;
        function toggleFullscreen() {
            const modal = document.getElementById('previewModal');
            const box = document.getElementById('previewModalBox');
            const btn = document.getElementById('fullscreenBtn');
            const icon = btn.querySelector('i');
            isFullscreen = !isFullscreen;
            if (isFullscreen) {
                modal.classList.add('preview-fullscreen');
                box.classList.remove('inset-2', 'md:inset-4', 'lg:inset-6', 'rounded-3xl');
                box.classList.add('inset-0', 'rounded-none');
                icon.className = 'fa fa-compress text-lg';
                btn.title = '退出全屏';
                // 启动控制栏自动隐藏
                startControlsAutoHide();
            } else {
                modal.classList.remove('preview-fullscreen', 'controls-hidden');
                box.classList.add('inset-2', 'md:inset-4', 'lg:inset-6', 'rounded-3xl');
                box.classList.remove('inset-0', 'rounded-none');
                icon.className = 'fa fa-expand text-lg';
                btn.title = '全屏预览';
                stopControlsAutoHide();
            }
            // 触发内容区域重绘
            const content = document.getElementById('previewModalContent');
            if (content) {
                content.style.display = 'none';
                void content.offsetHeight;
                content.style.display = '';
            }
        }

        // 全屏模式下控制栏自动隐藏
        function startControlsAutoHide() {
            stopControlsAutoHide();
            const modal = document.getElementById('previewModal');
            const box = document.getElementById('previewModalBox');
            // 进入全屏后立即隐藏控制栏
            modal.classList.add('controls-hidden');
            // 鼠标移动时显示控制栏，停止移动后隐藏
            let hideTimer = null;
            const showControls = () => {
                modal.classList.remove('controls-hidden');
                clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                    if (isFullscreen) {
                        modal.classList.add('controls-hidden');
                    }
                }, 800);
            };
            box.addEventListener('mousemove', showControls);
            box.addEventListener('touchstart', showControls);
            // 鼠标离开时立即隐藏
            box.addEventListener('mouseleave', () => {
                if (isFullscreen) {
                    modal.classList.add('controls-hidden');
                }
            });
        }

        function stopControlsAutoHide() {
            const box = document.getElementById('previewModalBox');
            if (box) {
                box.removeEventListener('mousemove', null);
                box.removeEventListener('touchstart', null);
                box.removeEventListener('mouseleave', null);
            }
        }

        // 隐藏文件预览面板

        // 更新文件预览
        function updateFilePreview() {
            const panel = document.getElementById('filePreviewPanel');
            
            if (selectedFiles.size === 0) {
                panel.style.display = 'none';
                return;
            }
            
            // 获取所有选中的文件
            const selectedFilesData = Array.from(selectedFiles)
                .map(path => allFilesData.find(f => f.path === path))
                .filter(Boolean);
            
            if (selectedFilesData.length > 0) {
                showFilePreviewPanel(selectedFilesData);
            }
        }

        function displayFiles(files) {
            allFilesData = files;
            filterFiles();
        }

        function filterFiles() {
            let filteredFiles = allFilesData;
            
            // 按分类过滤
            if (currentCategory !== 'all') {
                filteredFiles = filteredFiles.filter(file => file.type === currentCategory);
            }
            
            // 按搜索关键词过滤
            if (searchQuery.trim()) {
                const query = searchQuery.trim().toLowerCase();
                filteredFiles = filteredFiles.filter(file => {
                    // 文件名搜索
                    if (file.name.toLowerCase().includes(query)) return true;
                    // 日期搜索（支持中文日期如"2026/6/6"或"6月"）
                    if (file.last_modified) {
                        const dateStr = formatDate(file.last_modified);
                        if (dateStr.includes(query)) return true;
                        const dateObj = new Date(file.last_modified);
                        const month = (dateObj.getMonth() + 1) + '月';
                        const day = dateObj.getDate() + '日';
                        if (month.includes(query) || day.includes(query)) return true;
                    }
                    return false;
                });
            }
            
            renderFileList(filteredFiles);
        }

        function renderFileList(files) {
            currentDisplayedFiles = files;
            
            if (files.length === 0) {
                fileList.innerHTML = '<div class="flex items-center p-3 rounded-lg"><div class="flex-1 text-center text-sm text-white/70">暂无文件</div></div>';
                updateBulkActions();
                return;
            }

            const html = files.map((file, index) => {
                const iconClass = getFileIconClass(file.name);
                const icon = getFileIcon(file.name);
                const dateStr = file.last_modified ? formatDate(file.last_modified) : '--';
                const isSelected = selectedFiles.has(file.path);
                
                return `
                    <div class="flex p-3 rounded-lg hover:bg-white/10 transition-colors cursor-pointer group ${isSelected ? 'bg-sky-500/30 border border-sky-500/50' : ''}" data-path="${escapeHTML(file.path)}">

                            <input type="checkbox" class="w-5 h-5 cursor-pointer rounded border-white/30 bg-white/10 text-sky-500 focus:ring-sky-500/50 focus:ring-offset-0" ${isSelected ? 'checked' : ''} onchange="toggleSelectFile('${escapeHTML(file.path)}')">
                        </div>
                        <div class="w-10 h-10 bg-white/10 rounded-lg flex items-center justify-center mr-4 flex-shrink-0" onclick="event.stopPropagation(); downloadFile('${escapeHTML(file.path)}', '${escapeHTML(file.name)}')">
                            <i class="fa ${icon} ${iconClass}"></i>
                        </div>
                        <div class="flex-1 min-w-0" onclick="event.stopPropagation(); downloadFile('${escapeHTML(file.path)}', '${escapeHTML(file.name)}')">
                            <div class="text-sm break-all leading-tight">${escapeHTML(file.name)}${file.isLargeFile ? ' <span class="text-xs bg-purple-500/30 px-1 py-0.5 rounded text-purple-300 ml-1 inline-block mt-1">大文件</span>' : ''}</div>
                            <div class="flex items-center mt-1 text-xs text-white/50 space-x-3">
                                <span>${formatFileSize(file.size)}</span>
                                <span>${dateStr}</span>
                            </div>
                        </div>
                        <button class="ml-4 opacity-0 group-hover:opacity-100 transition-opacity text-red-400 hover:text-red-300 p-2 flex-shrink-0" onclick="event.stopPropagation(); deleteFile('${escapeHTML(file.path)}', '${escapeHTML(file.folder)}', '${escapeHTML(file.name)}')">
                            <i class="fa fa-trash"></i>
                        </button>
                    </div>
                `;
            }).join('');
            
            fileList.innerHTML = html;
            updateBulkActions();
        }

        // 切换文件选中状态
        function toggleSelectFile(path) {
            if (selectedFiles.has(path)) {
                selectedFiles.delete(path);
            } else {
                selectedFiles.add(path);
            }
            updateBulkActions();
            updateFilePreview();
            filterFiles();
        }

        // 分类过滤器事件监听
        document.getElementById('categoryFilters').addEventListener('click', function(e) {
            const btn = e.target.closest('.category-btn');
            if (btn) {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                filterFiles();
            }
        });

        // 搜索框事件监听
        document.getElementById('searchInput').addEventListener('input', function(e) {
            searchQuery = e.target.value;
            filterFiles();
        });

        // 更新批量操作UI
        function updateBulkActions() {
            const selectedCount = selectedFiles.size;
            const hasSelected = selectedCount > 0;
            const hasFiles = currentDisplayedFiles.length > 0;
            
            // 更新选中数量显示
            const selectedCountEl = document.getElementById('selectedCount');
            selectedCountEl.textContent = `已选择 ${selectedCount} 个文件`;
            selectedCountEl.className = hasSelected ? 'text-sm text-white font-medium' : 'text-sm text-white/60';
            
            // 更新按钮状态
            const bulkDownloadBtn = document.getElementById('bulkDownloadBtn');
            const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
            const deselectAllBtn = document.getElementById('deselectAllBtn');
            
            // 批量下载/删除只在有选中时可用
            [bulkDownloadBtn, bulkDeleteBtn].forEach(btn => {
                btn.disabled = !hasSelected;
            });
            
            // 全选/取消全选按钮始终可用（只要有文件）
            deselectAllBtn.disabled = !hasFiles;
            
            // 根据选中状态切换按钮文本
            if (hasSelected) {
                deselectAllBtn.textContent = '取消全选';
            } else {
                deselectAllBtn.textContent = '全选';
            }
        }

        // 初始化批量操作按钮事件
        document.getElementById('bulkDownloadBtn').addEventListener('click', bulkDownload);
        document.getElementById('bulkDeleteBtn').addEventListener('click', bulkDelete);
        document.getElementById('deselectAllBtn').addEventListener('click', () => {
            const hasSelected = selectedFiles.size > 0;
            if (hasSelected) {
                // 取消全选
                selectedFiles.clear();
            } else {
                // 全选当前页所有文件
                currentDisplayedFiles.forEach(file => {
                    selectedFiles.add(file.path);
                });
            }
            updateBulkActions();
            updateFilePreview();
            filterFiles();
        });

        // 批量下载
        async function bulkDownload() {
            const filesToDownload = allFilesData.filter(file => selectedFiles.has(file.path));
            if (filesToDownload.length === 0) return;
            
            showToast(`正在下载 ${filesToDownload.length} 个文件...`, 'info');
            
            for (const file of filesToDownload) {
                downloadFile(file.path, file.name);
                // 延迟一下，避免同时下载太多
                await new Promise(resolve => setTimeout(resolve, 300));
            }
        }

        // 批量删除
        async function bulkDelete() {
            const filesToDelete = allFilesData.filter(file => selectedFiles.has(file.path));
            if (filesToDelete.length === 0) return;
            
            if (!confirm(`确定要删除 ${filesToDelete.length} 个文件吗？此操作不可恢复！`)) {
                return;
            }
            
            let successCount = 0;
            let failCount = 0;
            
            for (const file of filesToDelete) {
                try {
                    const response = await fetch(`/api/files/${encodeURIComponent(file.path.startsWith('release/') ? file.path : file.name)}?category=${encodeURIComponent(file.folder)}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    if (data.ok) {
                        successCount++;
                    } else {
                        failCount++;
                    }
                } catch {
                    failCount++;
                }
            }
            
            selectedFiles.clear();
            loadFiles();
            
            if (failCount === 0) {
                showToast(`成功删除 ${successCount} 个文件`, 'success');
            } else {
                showToast(`删除完成：成功 ${successCount} 个，失败 ${failCount} 个`, 'warning');
            }
        }

        function formatDate(dateStr) {
            try {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return '--';
                return date.toLocaleDateString('zh-CN');
            } catch {
                return '--';
            }
        }

        function downloadFile(path, displayName) {
            // 通过 Worker 代理下载，直接传 path
            const url = `/download/${path.startsWith('release/') ? path : path.replace(/^\//, '')}`;
            // 使用用户看到的文件名，如果没有提供则从路径提取
            let filename = displayName || (path.startsWith('release/') ? 'download' : path.split('/').pop());
            
            // 尝试解码URL编码的文件名（处理后端返回的编码问题）
            try {
                const decoded = decodeURIComponent(filename);
                // 只有当解码后的文件名看起来更合理时才使用解码结果
                if (decoded !== filename && !decoded.includes('%') && decoded.length > 0) {
                    filename = decoded;
                }
            } catch (e) {
                // 如果解码失败，保持原文件名
            }
            
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('开始下载', 'success');
        }

        async function deleteFile(path, folder, name) {
            if (!confirm(`确定要删除文件 "${name}" 吗？`)) {
                return;
            }

            try {
                const filenameParam = path.startsWith('release/') ? path : name;
                const response = await fetch(`/api/files/${encodeURIComponent(filenameParam)}?category=${encodeURIComponent(folder)}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    showToast(`删除成功: ${name}`, 'success');
                    loadFiles();
                } else {
                    showToast(`删除失败: ${data.message}`, 'error');
                }
            } catch (error) {
                showToast('删除失败，请稍后重试', 'error');
            }
        }

        function handleFiles(files) {
            uploadList.classList.remove('hidden');
            
            Array.from(files).forEach(file => {
                const estimatedTime = estimateUploadTime(file.size);
                const fileSizeStr = formatFileSize(file.size);
                
                const uploadItem = document.createElement('div');
                uploadItem.className = 'glass flex items-center p-4 rounded-lg';
                uploadItem.innerHTML = `
                    <div class="w-10 h-10 bg-blue-100/20 rounded-lg flex items-center justify-center mr-4">
                        <i class="fa ${getFileIcon(file.name)} ${getFileIconClass(file.name)}"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-medium text-sm">${escapeHTML(file.name)}</div>
                        <div class="text-xs text-white/60 mt-1">${fileSizeStr} · ${estimatedTime}</div>
                        <div class="w-full h-2 bg-white/10 rounded-full overflow-hidden mt-2">
                            <div class="progress-bar h-full gradient-bg w-0 transition-all duration-300"></div>
                        </div>
                    </div>
                    <div class="text-sm text-white/70 ml-4 progress-text">0%</div>
                    <button class="retry-btn ml-3 px-3 py-1 bg-sky-500 hover:bg-sky-600 text-white text-sm rounded-lg transition-colors hidden">
                        <i class="fa fa-refresh mr-1"></i>重试
                    </button>
                    <button class="remove-btn ml-2 px-3 py-1 bg-white/10 hover:bg-white/20 text-white/70 text-sm rounded-lg transition-colors hidden">
                        <i class="fa fa-times mr-1"></i>移除
                    </button>
                `;
                uploadList.appendChild(uploadItem);
                
                const progressBar = uploadItem.querySelector('.progress-bar');
                const progressText = uploadItem.querySelector('.progress-text');
                const retryBtn = uploadItem.querySelector('.retry-btn');
                const removeBtn = uploadItem.querySelector('.remove-btn');
                let progress = 0;
                
                // 存储文件引用
                uploadItem._file = file;
                
                // 重试按钮点击事件
                retryBtn.addEventListener('click', () => {
                    retryUpload(uploadItem, file, progressBar, progressText, retryBtn, removeBtn);
                });
                
                // 移除按钮点击事件
                removeBtn.addEventListener('click', () => {
                    uploadItem.remove();
                });
                
                const interval = setInterval(() => {
                    progress += Math.random() * 15;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        progressText.textContent = '上传中...';
                        uploadFile(file, progressBar, progressText, retryBtn, removeBtn);
                    } else {
                        progressText.textContent = Math.round(progress) + '%';
                    }
                    progressBar.style.width = progress + '%';
                }, 200);
            });
        }

        async function retryUpload(uploadItem, file, progressBar, progressText, retryBtn, removeBtn) {
            // 重置状态
            progressBar.classList.remove('bg-red-500');
            progressBar.classList.add('gradient-bg');
            progressBar.style.width = '0%';
            retryBtn.classList.add('hidden');
            removeBtn.classList.add('hidden');
            
            // 重新开始上传
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 20;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    progressText.textContent = '上传中...';
                    uploadFile(file, progressBar, progressText, retryBtn, removeBtn);
                } else {
                    progressText.textContent = Math.round(progress) + '%';
                }
                progressBar.style.width = progress + '%';
            }, 150);
        }

        async function uploadFile(file, progressBar, progressText, retryBtn, removeBtn) {
            try {
                const isLargeFile = file.size >= 1024 * 1024;
                
                progressText.textContent = '上传中...';
                
                const formData = new FormData();
                formData.append('file', file);
                formData.append('filename', file.name);
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 300000);
                
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                const data = await response.json();
                
                if (data.ok) {
                    progressText.textContent = '完成';
                    showToast(`上传成功: ${file.name}`, 'success');
                    setTimeout(() => {
                        const uploadItem = progressBar.closest('.glass');
                        if (uploadItem) uploadItem.remove();
                        setTimeout(() => loadFiles(), 2000);
                    }, 1000);
                } else {
                    progressText.textContent = '失败';
                    progressBar.classList.remove('gradient-bg');
                    progressBar.classList.add('bg-red-500');
                    if (retryBtn) retryBtn.classList.remove('hidden');
                    if (removeBtn) removeBtn.classList.remove('hidden');
                    showToast(`上传失败: ${data.message || '未知错误'}`, 'error');
                }
            } catch (error) {
                progressText.textContent = error.name === 'AbortError' ? '超时' : '失败';
                progressBar.classList.remove('gradient-bg');
                progressBar.classList.add('bg-red-500');
                if (retryBtn) retryBtn.classList.remove('hidden');
                if (removeBtn) removeBtn.classList.remove('hidden');
                showToast(error.name === 'AbortError' ? '上传超时，请重试' : '上传失败，请稍后重试', 'error');
            }
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-20 right-6 px-4 py-3 rounded-lg shadow-lg z-50 ' +
                (type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500');
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' });
            });
        });

        document.addEventListener('DOMContentLoaded', loadFiles);
    </script>
</body>
</html>
